name: Portable Windows RAR

on:
  # Changes to packaging or launcher code intentionally trigger a fresh portable build.
  push:
    paths:
      - ".github/workflows/portable-windows.yml"
      - "src/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "scripts/package.ps1"
      - "scripts/windows-launcher.cs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-windows:
    name: Build portable Windows RAR
    runs-on: windows-latest
    steps:
      - name: Check out this fork branch
        uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2

      # Unit tests are run by the CI workflow for this source commit.
      # Keep this workflow focused on the optimized Windows package and its audit.

      - name: Build optimized Windows executable
        run: cargo build --release --locked

      - name: Stage portable application
        id: package
        shell: pwsh
        run: ./scripts/package.ps1 -NoBuild

      - name: Audit portable folder
        shell: pwsh
        run: |
          $stage = Join-Path $PWD "dist/Material Painter"
          $expected = @("Material Painter.exe", "Material Painter (Vulkan).exe")
          $executables = @(Get-ChildItem -Path $stage -Recurse -Filter "*.exe" -File | ForEach-Object { $_.Name })
          $unexpected = @($executables | Where-Object { $_ -notin $expected })
          $missing = @($expected | Where-Object { $_ -notin $executables })
          if ($executables.Count -ne 2 -or $unexpected.Count -gt 0 -or $missing.Count -gt 0) {
            throw "Portable EXE audit failed. Found: $($executables -join ', '); missing: $($missing -join ', '); unexpected: $($unexpected -join ', ')"
          }
          $strayLaunchers = @(Get-ChildItem -Path $stage -Recurse -File | Where-Object {
            $_.Extension -in @(".bat", ".cmd", ".lnk") -or $_.Name -eq "OPENGL-VIEWPORT-TEST.txt"
          })
          if ($strayLaunchers.Count -gt 0) {
            throw "Portable package contains development-only launchers or test notes: $($strayLaunchers.FullName -join ', ')"
          }
          "### Portable folder audit" | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_STEP_SUMMARY
          "- Executables: $($executables -join ', ')" | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_STEP_SUMMARY
          "- No batch files, shortcut files, or viewport test notes." | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_STEP_SUMMARY
          Get-ChildItem -Path $stage -Recurse -File | Select-Object FullName, Length

      - name: Install verified WinRAR command-line utility
        shell: pwsh
        run: |
          # Avoid the Chocolatey community feed: it intermittently returns HTTP 503.
          # Download the pinned WinRAR 7.23 x64 installer directly from RARLAB.
          $installer = Join-Path $env:RUNNER_TEMP "winrar-x64-723.exe"
          $url = "https://www.rarlab.com/rar/winrar-x64-723.exe"
          $expectedSha256 = "8ff0daf3ed564cc743c0e23ff2e253997ffc74460f9673f0b6dd037b2db4ce7b"
          $ProgressPreference = "SilentlyContinue"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $actualSha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "WinRAR installer SHA-256 mismatch. Expected $expectedSha256; got $actualSha256"
          }

          $process = Start-Process -FilePath $installer -ArgumentList "-s1" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "WinRAR installer exited with code $($process.ExitCode)"
          }

          $candidates = @((Join-Path $env:ProgramFiles "WinRAR\Rar.exe"))
          $programFilesX86 = [Environment]::GetEnvironmentVariable("ProgramFiles(x86)")
          if ($programFilesX86) {
            $candidates += Join-Path $programFilesX86 "WinRAR\Rar.exe"
          }
          $rarExe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $rarExe) { throw "Rar.exe was not found after the verified WinRAR install" }
          "WinRAR command-line tool: $rarExe" | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_STEP_SUMMARY

      - name: Create and verify RAR archive
        id: rar
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $stage = Join-Path $PWD "dist/Material Painter"
          $rar = Join-Path $PWD "dist/MaterialPainter-$version-windows-x64.rar"

          $rarExe = Join-Path $env:ProgramFiles "WinRAR/Rar.exe"
          if (-not (Test-Path $rarExe)) {
            $command = Get-Command Rar.exe -ErrorAction SilentlyContinue
            if ($command) { $rarExe = $command.Source }
          }
          if (-not (Test-Path $rarExe)) { throw "Rar.exe was not found after installing WinRAR" }

          if (Test-Path $rar) { Remove-Item -Force $rar }
          Push-Location $stage
          try {
            & $rarExe a -r -ep1 -m5 -idq $rar "*"
            if ($LASTEXITCODE -ne 0) { throw "RAR compression failed" }
          }
          finally {
            Pop-Location
          }

          & $rarExe t -idq $rar
          if ($LASTEXITCODE -ne 0) { throw "RAR integrity test failed" }

          "archive=$rar" | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_OUTPUT
          Get-Item $rar | Select-Object Name, Length

      - name: Upload the RAR file (without wrapping it in ZIP)
        uses: actions/upload-artifact@v7
        with:
          name: MaterialPainter-Windows-RAR
          path: ${{ steps.rar.outputs.archive }}
          archive: false
          if-no-files-found: error
          retention-days: 30
