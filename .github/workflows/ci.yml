# Windows-only CI: build without warnings and run unit tests.
name: CI
on:
  push:
    branches-ignore:
      - 'fix/**'
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked
        env:
          RUSTFLAGS: -D warnings
      - name: Unit tests
        run: cargo test --locked

      # The frame-time campaign must be tested in the optimized configuration,
      # not only the development build used by the compiler/test gate.
      - name: Build optimized release
        run: cargo build --locked --release
        env:
          RUSTFLAGS: -D warnings

      - name: Upload optimized frame-time test build
        uses: actions/upload-artifact@v4
        with:
          name: material-painter-frame-time-test
          path: target/release/material_painter.exe
          if-no-files-found: error
          retention-days: 14
