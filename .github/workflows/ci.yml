# Windows-only build and unit-test validation for this personal fork.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked
        env:
          RUSTFLAGS: -D warnings
      - name: Unit tests
        run: cargo test --locked
      # Hosted Windows runners may expose a Direct3D adapter; keep this
      # end-to-end GPU check informative without requiring a GPU on every runner.
      - name: GPU regressions - Low Poly Vertex ID modes
        run: cargo test --locked --bin material_painter bake::tests::low_poly_vertex_id_gpu_ -- --ignored --nocapture --test-threads 1
        env:
          WGPU_BACKEND: dx12
