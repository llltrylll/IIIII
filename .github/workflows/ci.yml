# Windows is the supported build target for this fork.
# Build without warnings and run the unit tests on the Windows toolchain.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked
        env:
          RUSTFLAGS: -D warnings
      - name: Unit tests
        run: cargo test --locked
