# Windows-only build, test, and portable package for this personal fork.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked
        env:
          RUSTFLAGS: -D warnings
      - name: Unit tests
        run: cargo test --locked
      # Hosted Windows runners may expose a Direct3D adapter; keep this
      # end-to-end GPU check informative without requiring a GPU on every runner.
      - name: GPU regressions - Low Poly Vertex ID modes
        run: cargo test --locked --bin material_painter bake::tests::low_poly_vertex_id_gpu_ -- --ignored --nocapture --test-threads 1
        env:
          WGPU_BACKEND: dx12
      - name: Package portable Windows build
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Upload portable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: MaterialPainter-Windows-x64-Portable
          path: dist/MaterialPainter-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
